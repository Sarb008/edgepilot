apiVersion: v1
kind: Pod
metadata:
  name: edgepilot-cpu-stress
  labels:
    app: edgepilot-cpu-stress
spec:
  nodeSelector:
    edgepilot.io/node: edge-node-1
  containers:
    - name: stress
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            i=0
            while [ $i -lt 4 ]; do
              while :; do :; done &
              i=$((i+1))
            done
            wait
          done
      resources:
        requests:
          cpu: "100m"
          memory: "16Mi"
        limits:
          cpu: "1000m"
          memory: "32Mi"
  restartPolicy: Never
